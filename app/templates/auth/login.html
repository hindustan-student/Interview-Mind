{% extends 'base.html' %}
{% block title %}Login | InterviewMind{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="form-card card animate-fade-up">
            <h1 class="text-center mb-2">Welcome Back</h1>
            <p class="text-secondary text-center mb-3">
                Log in to continue your interview preparation journey.
            </p>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if request.args.get('next') %}
                <input type="hidden" name="next" value="{{ request.args.get('next') }}">
                {% endif %}
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                           value="{{ form.get('email', '') }}" placeholder="you@example.com" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="••••••••" required>
                </div>
                <div class="form-group flex items-center gap-1">
                    <input type="checkbox" id="remember" name="remember" class="form-control" style="width:auto;">
                    <label for="remember" style="margin:0;text-transform:none;letter-spacing:0;color:var(--text-secondary);font-size:0.9rem;">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary w-full">Log In</button>
            </form>
            <p class="text-center mt-3 text-secondary">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">Sign up here</a>.
            </p>
        </div>
    </div>
</section>
{% endblock %}
