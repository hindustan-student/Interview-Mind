{% extends 'base.html' %}
{% block title %}Contact | InterviewMind{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="form-card card">
            <h1 class="text-center mb-2">Contact Us</h1>
            <p class="text-secondary text-center mb-3">
                Questions, feedback, or academic collaboration requests?
                Drop a note below.
            </p>
            <form method="POST" action="{{ url_for('main.contact') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" class="form-control"
                           placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="jane@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-control"
                              placeholder="How can we help?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-full">Send Message</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
